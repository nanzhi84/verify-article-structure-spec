<p class="p1"><b>长青街道开展</b><span class="s1"><b>"</b></span><b>执笔有度 自律有方</b><span class="s1"><b>"</b></span><b>未成年教育主题活动</b></p>
<p class="p2">活动伊始，海绵宝宝写作文趣味动画中轻松诙谐的画面快速拉近与孩子们的距离，引发在场亲子的强烈共鸣。随后的"作业吐槽大会"环节氛围热烈，孩子们大胆敞开心扉，纷纷道出自己的学习心声。</p>
<p class="p2">为帮助孩子们正视书写习惯的重要性，活动设置对比观察环节，通过展示潦草书写与工整书写的课本范本，引导孩子们换位思考，畅想"课本的心里话"。</p>
